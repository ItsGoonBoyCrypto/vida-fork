[project]
name = "vida-agent"
version = "0.1.0"
description = "Dagger module exposing the Vida agent wallet as sandboxed, LLM-bindable functions"
requires-python = ">=3.11"
dependencies = ["dagger-io"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vida_agent"]
