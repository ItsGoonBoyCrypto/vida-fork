# RH L2 Early Memecoin Scanner — example config
# Copy to config/config.yaml and fill in. Secrets can come from env instead
# (TELEGRAM_BOT_TOKEN, RHL2_RPC_URL, RHL2_EXPLORER_API_KEY, ...).

chain:
  name: robinhood-l2
  # TODO: confirm Robinhood Chain's real values before production use.
  chain_id: 0
  rpc_url: ""                 # e.g. https://rpc.robinhood-l2.example
  explorer_api_url: ""        # Etherscan-style API base, e.g. https://explorer.../api
  explorer_api_key: ""
  # DexScreener chain slug. RH L2 slug TBD — use "base" to exercise the pipeline
  # against a live, indexed EVM L2 until RH L2 is listed.
  dexscreener_chain: "base"
  native_symbol: "ETH"
  weth_address: ""                # wrapped-native; needed for swap sim + pool listener
  excluded_holder_addresses: []   # LP pools, lockers, treasury to exclude from top-holder math

  # --- New-pool factory listener (earliest discovery) ---
  dex_factory_address: ""         # UniV2/V3-style factory emitting PairCreated/PoolCreated
  dex_factory_kind: "univ2"       # "univ2" | "univ3"
  pool_scan_block_lookback: 3000  # blocks to backfill on first poll
  pool_scan_max_range: 5000       # cap per eth_getLogs call

  # --- Swap simulation (honeypot / tax) ---
  dex_router_address: ""          # UniV2-style router for the sell simulation

  # --- Third-party safety (RugCheck-equivalent for EVM) ---
  goplus_chain_id: ""             # GoPlus decimal chain id as string, e.g. "8453" (Base). Empty = skip.
  goplus_api_url: "https://api.gopluslabs.io/api/v1/token_security"
  honeypot_api_url: ""            # optional honeypot.is-compatible endpoint (cross-check / RH L2 fallback)

  lp_locker_addresses: []         # LP held at these addresses counts as "locked"

weights:            # composite category weights (auto-normalized)
  safety: 0.38
  distribution: 0.20
  momentum: 0.25
  discovery: 0.17

active_tier: momentum   # sniper | momentum

tiers:
  sniper:
    thresholds:
      max_age_minutes: 120
      min_liquidity_usd: 8000
      thin_liquidity_usd: 4000
      min_holders: 40
      max_top10_pct: 30
      skip_top10_pct: 40
      min_volume_24h_usd: 3000
      min_buy_ratio_1h: 0.55
      strong_alert_score: 72
      watch_alert_score: 58
  momentum:
    thresholds:
      max_age_minutes: 1440
      min_liquidity_usd: 15000
      thin_liquidity_usd: 5000
      min_holders: 100
      max_top10_pct: 25
      skip_top10_pct: 35
      min_volume_24h_usd: 10000
      min_buy_ratio_1h: 0.60
      strong_buy_ratio_1h: 0.70
      strong_alert_score: 75
      watch_alert_score: 60

telegram:
  bot_token: ""            # or env TELEGRAM_BOT_TOKEN
  alert_chat_id: ""        # channel/chat id for alerts
  admin_user_ids: []       # ids allowed to use /tier /set /addwallet

runtime:
  poll_interval_seconds: 20
  request_timeout_seconds: 15
  max_concurrent_enrichments: 8
  db_path: "scanner.db"
  dry_run: false           # true = print alerts instead of sending to Telegram
  log_level: "INFO"
  realert_cooldown_seconds: 21600   # 6h

# Curated high-win-rate wallets (lowercase). Also loadable via /addwallet.
smart_money_wallets: []
