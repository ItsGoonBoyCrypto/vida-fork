# Robinhood Chain (RH L2) — REAL mainnet config. This is the target chain.
# Mainnet live since 2026-07-01. Arbitrum-Orbit EVM L2, chain id 4663, ETH gas.
# DexScreener indexes it as slug "robinhood"; explorer is Blockscout.
#
#   cp rhl2_scanner/config/robinhood.example.yaml rhl2_scanner/config/config.yaml
#   python -m rhl2_scanner paper --config rhl2_scanner/config/config.yaml
#
# Discovery (DexScreener) + safety (on-chain + Blockscout) work out of the box.
# The OPTIONAL fields marked TODO enable extra features (factory pool-listener,
# on-chain honeypot sell-sim) — fill them from the explorer when you have them.

chain:
  name: robinhood-l2
  chain_id: 4663
  rpc_url: "https://rpc.mainnet.chain.robinhood.com"
  # Blockscout Etherscan-compatible API (no key required; add one if you have it).
  explorer_api_url: "https://robinhoodchain.blockscout.com/api"
  explorer_api_key: ""
  dexscreener_chain: "robinhood"
  native_symbol: "ETH"
  # Robinhood Wrapped ETH (WETH9) — verified across Uniswap subgraph + SDK + on-chain token0().
  weth_address: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
  excluded_holder_addresses: []

  # --- New-pool factory listener (earliest discovery) ---
  # Uniswap V3 factory on Robinhood Chain (emits PoolCreated). RH launchers use V3.
  dex_factory_address: "0x1f7d7550B1b028f7571E69A784071F0205FD2EfA"
  dex_factory_kind: "univ3"
  pool_scan_block_lookback: 3000
  pool_scan_max_range: 5000

  # --- On-chain honeypot sell-sim ---
  # Uniswap V3 SwapRouter02 on Robinhood Chain (exactInputSingle sell-sim).
  dex_router_address: "0xCaf681a66D020601342297493863E78C959E5cb2"
  dex_router_kind: "univ3"
  dex_v3_fee_tiers: [10000, 3000, 500]   # 1% / 0.3% / 0.05% pools to try
  honeypot_simulator_bytecode: ""  # optional: compiled contracts/HoneypotSimulator.sol
  honeypot_sim_amount_wei: 10000000000000000

  # --- Third-party safety (RugCheck-equivalent) ---
  # GoPlus may not cover chain 4663 yet — if uncovered it returns empty (safe:
  # the on-chain checks + Blockscout carry safety). Harmless to leave set.
  goplus_chain_id: "4663"
  goplus_api_url: "https://api.gopluslabs.io/api/v1/token_security"
  honeypot_api_url: ""

  lp_locker_addresses: []
  lp_lock_min_fraction: 0.5
  lp_lockers: []

weights:
  safety: 0.38
  distribution: 0.20
  momentum: 0.25
  discovery: 0.17

active_tier: momentum

# Your tuned hard-gate + scoring thresholds for RH L2 (momentum tier).
tiers:
  momentum:
    thresholds:
      max_age_minutes: 1440         # < 24h
      min_liquidity_usd: 10000      # >= $10k
      thin_liquidity_usd: 5000      # hard-skip under $5k
      min_market_cap_usd: 40000     # $40k floor
      max_market_cap_usd: 1000000   # $1M ceiling
      ideal_mcap_low: 50000         # sweet spot $50k
      ideal_mcap_high: 400000       # sweet spot $400k
      max_top10_pct: 20             # top10 <= 20%
      skip_top10_pct: 25            # skip above 25%
      max_top1_pct: 6               # top1 <= 6%
      min_holders: 100              # >= 100 holders
      max_bundle_pct: 6             # bundle <= 6%
      skip_bundle_pct: 10           # skip above 10%
      max_sniper_cluster_pct: 15    # sniper cluster <= 15%
      max_dev_holdings_pct: 5       # dev <= 5%
      max_tax_pct: 1                # buy/sell tax <= 1% each
      min_lp_lock_seconds: 2592000  # LP lock >= 30 days
      strong_alert_score: 75        # >= 75 = Strong alert
      watch_alert_score: 60         # 60-74 = Watch

runtime:
  poll_interval_seconds: 20
  request_timeout_seconds: 15
  max_concurrent_enrichments: 6
  db_path: "scanner.db"
  # `paper` command always forces dry-run (calibration). This flag only governs
  # the `run` command: false = `run` sends LIVE alerts. So: paper=calibration,
  # run=live — the only change to go live is the start command word.
  dry_run: false
  log_level: "INFO"
  realert_cooldown_seconds: 21600
  # Live alerts on RH Chain today: strict on all confirmable metrics (verified,
  # authorities revoked, LP burned, top10/holders/bundle/momentum) + router-free
  # honeypot check; tolerates unconfirmed tax until a V3 router/oracle is wired.
  live_pragmatic_safety: true
  paper_mode: false                # `paper` command forces this on
  paper_record_floor: 45
  paper_checkpoint_hours: [1, 6, 24]
  paper_settle_batch: 25
  paper_digest_enabled: true
  paper_digest_interval_hours: 1      # hourly while ramping up; raise to 24 later
  paper_digest_win_multiple: 2.0
  send_startup_message: true          # posts a "scanner online" msg on each boot

telegram:
  bot_token: ""                    # env TELEGRAM_BOT_TOKEN
  alert_chat_id: ""                # env TELEGRAM_ALERT_CHAT_ID
  admin_user_ids: []

smart_money_wallets: []
