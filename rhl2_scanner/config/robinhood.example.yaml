# Robinhood Chain (RH L2) — REAL mainnet config. This is the target chain.
# Mainnet live since 2026-07-01. Arbitrum-Orbit EVM L2, chain id 4663, ETH gas.
# DexScreener indexes it as slug "robinhood"; explorer is Blockscout.
#
#   cp rhl2_scanner/config/robinhood.example.yaml rhl2_scanner/config/config.yaml
#   python -m rhl2_scanner paper --config rhl2_scanner/config/config.yaml
#
# Discovery (DexScreener) + safety (on-chain + Blockscout) work out of the box.
# The OPTIONAL fields marked TODO enable extra features (factory pool-listener,
# on-chain honeypot sell-sim) — fill them from the explorer when you have them.

chain:
  name: robinhood-l2
  chain_id: 4663
  rpc_url: "https://rpc.mainnet.chain.robinhood.com"
  # Blockscout Etherscan-compatible API (no key required; add one if you have it).
  explorer_api_url: "https://robinhoodchain.blockscout.com/api"
  explorer_api_key: ""
  dexscreener_chain: "robinhood"
  native_symbol: "ETH"
  # Robinhood Wrapped ETH (WETH9) — verified across Uniswap subgraph + SDK + on-chain token0().
  weth_address: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
  excluded_holder_addresses: []

  # --- New-pool factory listener (earliest discovery) ---
  # Uniswap V3 factory on Robinhood Chain (emits PoolCreated). RH launchers use V3.
  dex_factory_address: "0x1f7d7550B1b028f7571E69A784071F0205FD2EfA"
  dex_factory_kind: "univ3"
  pool_scan_block_lookback: 3000
  pool_scan_max_range: 5000
  # Non-vanity flap detection: per-cycle budget of Portal.getTokenV2 confirmations
  # for candidates that lack the 8888/7777 suffix (catches tokens like $meow).
  # Each address is cached so it's checked at most once. 0 = suffix-only.
  curve_confirm_budget: 10

  # --- Bonding-curve launchpads (flap.sh) — EARLIEST catch, pre-graduation ---
  # flap launches onto a bonding curve; a token only hits DexScreener AFTER it
  # graduates to a DEX (late for a runner). We watch the flap "Portal" contract's
  # logs to catch launches on the curve.
  #   flap contracts on Robinhood Chain:
  #     Portal (launchpad/curve): 0x26605f322f7fF986f381bB9A6e3f5DAb0bEaEb09
  #     VaultPortal:              0xe9F7AB7DE8FB8756acbB6a1cd13316a43308197B
  #     Standard Token Impl:      0x88882688a067FE97E11C2185b996286e53132222
  #     Tax Token V3 Impl:        0x7777C8743C88B3aff3cf262135beF2c8b2e83333
  #     Tax Token Helper:         0xb10bD2672aE63735d677164A54B573a016f0203C
  # create_topic is blank => DISCOVERY mode: the listener logs every distinct
  # event topic0 the Portal emits (grep host logs for "curve discovery [flap]").
  # Paste one of those lines back and we pin the real creation signature via
  # RHL2_FLAP_CREATE_TOPIC + token_arg so tokens decode automatically.
  launchpads:
    - name: flap
      manager: "0x26605f322f7fF986f381bB9A6e3f5DAb0bEaEb09"   # flap Portal
      kind: curve
      create_topic: ""       # env RHL2_FLAP_CREATE_TOPIC (blank => discovery mode)
      graduate_topic: ""     # env RHL2_FLAP_GRADUATE_TOPIC (optional)
      token_arg: topic1      # where the new-token address sits in the create event
      boost: 15              # discovery-score bump for flap-origin tokens
      # MOST flap tokens carry a vanity SUFFIX: 8888 (standard) / 7777 (tax). We
      # match those off the Portal's logs by suffix — free, and immune to the
      # trader/creator/uint noise in events. Tokens WITHOUT the suffix (e.g.
      # $meow, ending 0aa9) are caught by confirming non-suffix candidates via
      # Portal.getTokenV2 (see chain.curve_confirm_budget below).
      token_suffixes: ["8888", "7777"]
      # Token implementation templates (8888/7777 PREFIX) — clones of these.
      token_impls:
        - "0x88882688a067FE97E11C2185b996286e53132222"
        - "0x7777C8743C88B3aff3cf262135beF2c8b2e83333"

    # --- More RH launchpads (added after Noxa shut down) ---------------------
    # Graduated tokens from these are ALREADY caught via DexScreener; adding them
    # here gets the PRE-graduation edge + origin labeling. Each runs in DISCOVERY
    # mode (logs event shapes → grep host logs for "curve discovery [name]") until
    # we pin its create_topic or a confirm_fn. VERIFY each address on
    # robinhoodchain.blockscout.com before trusting it — the addresses below are
    # from public research, not on-chain-confirmed by the bot.
    - name: robinfun
      # RobinFunFactory (source-verified): 0xD952A74C85a2221a7DaB185c62cfD7EBa8C94AFC.
      # RobinFun shares the Bags contract design — the factory exposes a
      # curveForToken(token) registry that returns the token's bonding curve
      # (non-zero) for one of ITS tokens, so we confirm non-suffix candidates that
      # way. Graduated RobinFun tokens are already caught via DexScreener; this
      # adds detection + origin labeling. Pre-grad PRICING needs the RobinFun lens
      # address (getTokenState) — not yet wired; set RHL2_ROBINFUN_MANAGER to a
      # verified lens + a confirm_fn if/when you have it.
      # NOTE: curveForToken is a best-guess from the shared architecture. If the
      # host logs show `curve discovery [robinfun]` lines instead of catches, the
      # fn name differs — paste one line and we pin the exact create_topic.
      manager: "0xD952A74C85a2221a7DaB185c62cfD7EBa8C94AFC"   # RHL2_ROBINFUN_MANAGER overrides
      kind: curve
      create_topic: ""       # RHL2_ROBINFUN_CREATE_TOPIC (blank => discovery+confirm)
      confirm_fn: "curveForToken(address)"
      token_arg: topic1
      boost: 12
    - name: bags
      # bags.fm — FULLY WIRED + LIVE. Discovery uses the BagsFactory registry
      # (allTokensLength + getTokens tail — no log/topic needed); pricing uses
      # BagsLens.getTokenState(token) → exists/migrated/price/progress/reserves.
      # Addresses from the Bags RH mainnet deploy (docs.bags.fm/robinhood).
      manager: "0xC82Db941dAf90B754aecb5F7D14c683dc608d595"   # BagsLens (RHL2_BAGS_MANAGER/_LENS overrides)
      factory: "0xe8Cc4431adF8b5A847C113EF0c6af9043219Cb37"   # BagsFactory proxy (RHL2_BAGS_FACTORY overrides)
      trade_url_template: "https://bags.fm/{token}"           # one-tap Trade link in alerts
      kind: curve
      boost: 12
      confirm_fn: "getTokenState(address)"
    # Note: MetaLaunch (0x49A3D384cd90A58815df31C1852dB4095B90c0De) is pool-from-
    # day-one (no bonding curve), so DexScreener catches its tokens at launch —
    # no curve wiring needed.

  # --- flap curve pricing (pre-graduation) ---
  # flap tokens trade on a bonding curve BEFORE they hit a DEX, so DexScreener
  # can't price them yet. We read the curve state directly from the Portal
  # (getTokenV2) and convert its ETH figures to USD using a live ETH/USD rate,
  # which the scanner LEARNS for free from any graduated RH pair it sees
  # (priceUsd / priceNative). Until it has learned one, set a bootstrap hint so
  # day-one flap tokens still get USD-scored:
  #     env RHL2_ETH_USD = 3500     (optional — the learned live value always wins)

  # --- On-chain honeypot sell-sim ---
  # Uniswap V3 SwapRouter02 on Robinhood Chain (exactInputSingle sell-sim).
  dex_router_address: "0xCaf681a66D020601342297493863E78C959E5cb2"
  dex_router_kind: "univ3"
  dex_v3_fee_tiers: [10000, 3000, 500]   # 1% / 0.3% / 0.05% pools to try
  honeypot_simulator_bytecode: ""  # optional: compiled contracts/HoneypotSimulator.sol
  honeypot_sim_amount_wei: 10000000000000000

  # --- Third-party safety (RugCheck-equivalent) ---
  # GoPlus may not cover chain 4663 yet — if uncovered it returns empty (safe:
  # the on-chain checks + Blockscout carry safety). Harmless to leave set.
  goplus_chain_id: "4663"
  goplus_api_url: "https://api.gopluslabs.io/api/v1/token_security"
  honeypot_api_url: ""

  lp_locker_addresses: []
  lp_lock_min_fraction: 0.5
  lp_lockers: []

# Tuned off 24 alerts of live data (2026-07-19): the 60-74 "watch" band rugged
# 42% while the quieter 45-59 band hit 36% / rugged 18% — i.e. the composite was
# rewarding HYPE (momentum+discovery) that rugs on RH. Shifted weight toward
# substance (safety+distribution, the winning cohort's profile) and away from
# hype. Only reshapes the maturity/watch tier; the 🌱 early-launch path (the top
# performer) is score-independent and unaffected. Revisit at ~50 settled alerts.
weights:
  safety: 0.40         # was 0.38
  distribution: 0.24   # was 0.20 — the 45-59 winners lean on clean distribution
  momentum: 0.21       # was 0.25 — momentum spikes were a rug tell
  discovery: 0.15      # was 0.17 — hype/boost/socials correlated with rugs

active_tier: momentum

# Your tuned hard-gate + scoring thresholds for RH L2 (momentum tier).
tiers:
  momentum:
    thresholds:
      max_age_minutes: 1440         # < 24h
      min_age_minutes: 0
      # --- Sub-$100K early-gem tuning (small fresh tokens, but not dust) ---
      # Tightened after alert-volume feedback: floors raised so thin/dead launches
      # stop qualifying, while still well inside sub-$100K gem territory.
      min_liquidity_usd: 3500       # was 2000 — cut the thin/dead pools
      thin_liquidity_usd: 3500      # hard-skip floor
      min_market_cap_usd: 8000      # was 4000 — skip the dust; real gems clear this fast
      max_market_cap_usd: 150000    # was 1M — focus on sub-100k gems (50k headroom)
      max_top10_pct: 15             # top10 scoring reason threshold
      skip_top10_pct: 75            # was 60 — brand-new tokens are naturally concentrated
      max_top1_pct: 0               # 0 = disabled (any value >0 gates top1)
      min_holders: 30               # was 100 — holder-score ramp start (NOT a gate)
      max_bundle_pct: 6             # bundle scoring reason threshold
      skip_bundle_pct: 22           # was 15 — allow more early clustering
      max_sniper_cluster_pct: 22    # was 15 — early buyers cluster naturally
      # ...but only enforce it once the token has aged past its launch window —
      # on a minutes-old token the metric pins ~100% (everyone bought at launch)
      # and would wrongly hard-skip every fresh gem.
      sniper_cluster_min_age_minutes: 45
      # RH Chain gives no verification / GoPlus / readable V3 LP, so score_safety
      # would be 0 for every token — and at safety's 0.38 weight the composite
      # then maxes at 62, below the 63 watch band (maturity tier unreachable).
      # This floor = "passed the gate, no confirmable danger" so quality tokens
      # can still score into the band on momentum + distribution + discovery.
      safety_baseline: 45
      max_dev_holdings_pct: 10      # KEPT — dev holding >10% is a real red flag
      max_tax_pct: 1                # HARD skip if KNOWN tax above 1% each
      min_lp_lock_seconds: 0        # 0 = any lock duration accepted
      require_contract_verified: false  # RH Chain barely verifies contracts.
      ideal_mcap_low: 15000
      ideal_mcap_high: 100000
      ideal_holders: 120            # was 300 — small gems reach full holder score sooner
      min_volume_24h_usd: 6000      # was 2500 — require real trading, not a ghost token
      min_buy_ratio_1h: 0.62        # was 0.60 — a touch more net-buy conviction
      strong_buy_ratio_1h: 0.72     # was 0.70
      # Short-term velocity: last-5-min volume rate vs the trailing 1h rate.
      # This is the EARLIEST momentum tell — moves within minutes of launch.
      # 1.2 = last 5 min running 20% hotter than the hour; 2.0 = surging (2x).
      min_volume_velocity: 1.2
      strong_volume_velocity: 2.0
      min_external_risk_score: 60
      smart_money_min_wallets: 2
      strong_alert_score: 75        # >= 75 = Strong alert
      watch_alert_score: 63         # was 50 — raised to cut the Watch-band flood
      # Graduation-imminent boost: a flap token 55-92% bonded is at the sweet spot
      # where the run often starts, but has no DEX pair yet (thin momentum data).
      # These composite points let a genuinely-imminent one reach the alert band.
      grad_sweet_low: 55
      grad_sweet_high: 92
      grad_boost_points: 10

runtime:
  poll_interval_seconds: 20
  request_timeout_seconds: 15
  max_concurrent_enrichments: 6
  db_path: "scanner.db"
  # `paper` command always forces dry-run (calibration). This flag only governs
  # the `run` command: false = `run` sends LIVE alerts. So: paper=calibration,
  # run=live — the only change to go live is the start command word.
  dry_run: false
  log_level: "INFO"
  realert_cooldown_seconds: 21600
  # Early-launch alerts (🌱): the main way fresh sub-$100K gems surface — they
  # have thin data and can't reach the maturity score, so we alert on SAFE +
  # fresh + a real pool instead. Widened to catch more small early gems.
  early_launch_enabled: true
  early_launch_max_age_minutes: 90      # was 180 — tighter window cuts stale-launch noise
  early_launch_min_liquidity_usd: 3500  # was 1500 — a real pool, not dust
  early_launch_require_safety: true     # still require the safety gate to pass
  # Quality gates so 🌱 isn't just "safe + has a pool" (that was the flood). Each
  # only bites when the metric is known, so genuinely-fresh thin data still passes.
  early_launch_min_holders: 25          # reject dead launches (a handful of holders)
  early_launch_min_buy_ratio_1h: 0.55   # require net buying when txns exist
  early_launch_min_volume_1h_usd: 800   # require some real 1h volume when known
  # Live alerts on RH Chain today: strict on all confirmable metrics (verified,
  # authorities revoked, LP burned, top10/holders/bundle/momentum) + router-free
  # honeypot check; tolerates unconfirmed tax until a V3 router/oracle is wired.
  live_pragmatic_safety: true
  paper_mode: false                # `paper` command forces this on
  paper_record_floor: 45
  paper_checkpoint_hours: [1, 6, 24]
  paper_settle_batch: 25
  paper_digest_enabled: true
  paper_digest_interval_hours: 1      # hourly while ramping up; raise to 24 later
  paper_digest_win_multiple: 2.0
  # --- Bounded auto-tune of scoring weights (opt-in: RHL2_AUTOTUNE=1) ---
  # Once enough alerts have SETTLED, nudge the category weights toward the signal
  # that actually separated winners from rugs (see /perf "By signal"). Tight
  # leash: dormant until min_settled, tiny steps, hard-clamped to baseline ±
  # max_drift, fully reversible with `/autotune reset`.
  # --- Wallet reputation (self-curating smart set) ---
  # The smart set is quality-weighted, not a flat headcount: a wallet early on
  # many winners outweighs unproven harvests, repeat-ruggers get tokens demoted,
  # and a proven multi-winner wallet fires a 💎 alert on its own. Build it with
  # /harvest (winners) + /harvestrug (rugs); review with /alpha + /deployers.
  core_alpha_min_overlap: 3        # distinct winners for a wallet to be "core alpha"
  core_alpha_alert: true           # fire 💎 on a core-alpha single-wallet buy
  toxic_min_rugs: 2                # distinct rugs (net vs winners) → toxic → demote
  rug_peak_mult_ceiling: 0.5       # a token whose peak fell to/below this = rug

  autotune_enabled: false
  autotune_min_settled: 30            # dormant until this many alerts have settled
  autotune_min_bucket: 5             # min samples in a high/low bucket for its edge to count
  autotune_step: 0.02                # max weight move per run (pre-clamp)
  autotune_max_drift: 0.08           # a weight can never leave baseline ± this
  autotune_interval_hours: 24        # how often to re-tune
  send_startup_message: true          # posts a "scanner online" msg on each boot

telegram:
  bot_token: ""                    # env TELEGRAM_BOT_TOKEN
  alert_chat_id: ""                # env TELEGRAM_ALERT_CHAT_ID
  admin_user_ids: []

# Smart-money seed set: wallets that bought previous bangers early. A token
# these wallets buy scores higher (discovery), and — with autoseed on — a token
# that graduates to a STRONG alert donates its earliest buyers back into the set
# (self-improving). Manage live with /smart 0x.., /unsmart 0x.., /smartlist.
#   Seed durably:  RHL2_SMART_WALLETS = 0xabc..,0xdef..   (env survives redeploys)
#   Auto-grow:     RHL2_SMART_AUTOSEED = 1  (turn on once /diag shows the explorer
#                  transfer feed works, else it can't read buyers)
# Proven early-entry wallets — caught cashcat / arrow / tendies early. Seeded
# so any NEW token they buy scores higher (discovery) and, if also in
# wallet_watch below, fires a direct "smart money bought X" alert.
smart_money_wallets:
  - "0xae6ad7c09668c8c6b2838e0c92b28fb2db891ff7"
  - "0xbde8bbc336b548357c841b5a5290f553e4ff8809"
  - "0x0a01b82508f877b8923bae8427a3d60fec5bd707"
  - "0xc1a3e23049e2f016d61d2a2e4fbb241df20b10d7"
  - "0xe781b28e02ed5fc4b989905cb6848d318f4735fd"
  - "0x5638484ba2d2f1d1d35020572b0aa439a9869192"
  - "0x82608cb7ba84322a7a0d4cc0df8f1d2d065877ef"
  - "0x39069add37ea21d3db98e01e8ad81bacef739168"
  - "0x6099ff02f63c69162175249c2700c84c0a94dafa"
  - "0x8e65cbcdc822968131b1e37e5cee02c9ce82ab21"
  - "0xf70da97812cb96acdf810712aa562db8dfa3dbef"
  - "0x8f47a238c7701247ee8469ddc37ac1df121cfcce"
  - "0x3b1f57028e5bc1f28c7201b1f6bd913e46b64e62"
  - "0x16f5ef133d0d15b196a778d22bf1ec56f8f37c05"

# Whale / smart-money wallet activity alerts (independent of the gem scan).
# Fastest to enable: set env RHL2_WATCH_WALLETS=0xabc...,0xdef... in Railway.
# NOTE: RHL2_WATCH_WALLETS (if set) REPLACES this list — include all six there.
wallet_watch:
  enabled: true
  wallets:
    - "0xae6ad7c09668c8c6b2838e0c92b28fb2db891ff7"
    - "0xbde8bbc336b548357c841b5a5290f553e4ff8809"
    - "0x0a01b82508f877b8923bae8427a3d60fec5bd707"
    - "0xc1a3e23049e2f016d61d2a2e4fbb241df20b10d7"
    - "0xe781b28e02ed5fc4b989905cb6848d318f4735fd"
    - "0x5638484ba2d2f1d1d35020572b0aa439a9869192"
    - "0x82608cb7ba84322a7a0d4cc0df8f1d2d065877ef"
    - "0x39069add37ea21d3db98e01e8ad81bacef739168"
    - "0x6099ff02f63c69162175249c2700c84c0a94dafa"
    - "0x8e65cbcdc822968131b1e37e5cee02c9ce82ab21"
    - "0xf70da97812cb96acdf810712aa562db8dfa3dbef"
    - "0x8f47a238c7701247ee8469ddc37ac1df121cfcce"
    - "0x3b1f57028e5bc1f28c7201b1f6bd913e46b64e62"
    - "0x16f5ef133d0d15b196a778d22bf1ec56f8f37c05"
  labels:
    "0xae6ad7c09668c8c6b2838e0c92b28fb2db891ff7": "Early 1"
    "0xbde8bbc336b548357c841b5a5290f553e4ff8809": "Early 2"
    "0x0a01b82508f877b8923bae8427a3d60fec5bd707": "Early 3"
    "0xc1a3e23049e2f016d61d2a2e4fbb241df20b10d7": "Early 4"
    "0xe781b28e02ed5fc4b989905cb6848d318f4735fd": "Early 5"
    "0x5638484ba2d2f1d1d35020572b0aa439a9869192": "Early 6"
    "0x82608cb7ba84322a7a0d4cc0df8f1d2d065877ef": "Early 7"
    "0x39069add37ea21d3db98e01e8ad81bacef739168": "Early 8"
    "0x6099ff02f63c69162175249c2700c84c0a94dafa": "Early 9"
    "0x8e65cbcdc822968131b1e37e5cee02c9ce82ab21": "Early 10"
    "0xf70da97812cb96acdf810712aa562db8dfa3dbef": "Early 11"
    "0x8f47a238c7701247ee8469ddc37ac1df121cfcce": "Early 12"
    "0x3b1f57028e5bc1f28c7201b1f6bd913e46b64e62": "Early 13"
    "0x16f5ef133d0d15b196a778d22bf1ec56f8f37c05": "Early 14"
  alert_on: "buys_sells"       # classify buys AND sells (sells feed EXIT alerts)
  min_usd: 100                 # ignore transfers below this USD value
  max_transfers_per_wallet: 25
  # Sybil groups: wallets run by the SAME person count as one buyer for the
  # cluster signal. Early 10 & 13 are the same actor — grouped so their joint
  # buys don't fake a 2-wallet convergence. Add more addr->group pairs as you
  # spot them.
  wallet_groups:
    "0x8e65cbcdc822968131b1e37e5cee02c9ce82ab21": "Early 10/13"
    "0x3b1f57028e5bc1f28c7201b1f6bd913e46b64e62": "Early 10/13"
    "0xe781b28e02ed5fc4b989905cb6848d318f4735fd": "Early 5/6"
    "0x5638484ba2d2f1d1d35020572b0aa439a9869192": "Early 5/6"
  # No individual "🐋 whale bought/sold X" pings — instead buys feed the cluster
  # signal + gem scoring, and sells feed the 🔴 smart-money EXIT alert on tokens
  # smart money bought. Flip the raw pings back on with RHL2_WHALE_ALERTS=1.
  emit_alerts: false
